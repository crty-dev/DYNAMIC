<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1d2f" />
    <title>DYNAMIC — Modern analytics for the open web</title>
    <meta
      name="description"
      content="DYNAMIC is an open-source, privacy-first web analytics & RUM platform that runs entirely on Cloudflare's free tier. No cookies. No personal data. No surprise invoices."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Brand images come from the Cloudinary CDN -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Above-the-fold fonts (Latin-subset woff2, ~13 KB each) -->
    <link
      rel="preload"
      href="/fonts/Montserrat-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Montserrat-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DYNAMIC" />
    <meta property="og:title" content="DYNAMIC — Modern analytics for the open web" />
    <meta
      property="og:description"
      content="Privacy-first web analytics & RUM. Open source under MIT. Runs entirely on Cloudflare's free tier."
    />
    <meta property="og:url" content="https://dynamic.crty-dev.com/" />
    <meta property="og:image" content="https://dynamic.crty-dev.com/og-dynamic.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DYNAMIC — Modern analytics for the open web" />
    <meta name="twitter:description" content="Privacy-first web analytics & RUM. Open source under MIT." />
    <meta name="twitter:image" content="https://dynamic.crty-dev.com/og-dynamic.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
